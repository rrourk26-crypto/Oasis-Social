name: iOS build → TestFlight

# Run it from GitHub: Actions tab → "iOS build → TestFlight" → Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios

    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v5

      - name: Check secrets are set
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM_ID" ]       || missing="$missing APPLE_TEAM_ID"
          [ -n "$ASC_KEY_ID" ]    || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$P8" ]            || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (add them under Settings > Secrets and variables > Actions > Secrets tab)"
            exit 1
          fi
          case "$P8" in *"BEGIN PRIVATE KEY"*) ;; *) echo "::error::ASC_KEY_P8 must include the -----BEGIN PRIVATE KEY----- and -----END PRIVATE KEY----- lines"; exit 1;; esac
          echo "All 4 secrets found."

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write App Store Connect API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_FILE="$RUNNER_TEMP/keys/AuthKey.p8"
          # strip Windows line endings / stray spaces that break the key
          printf '%s\n' "$P8" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' > "$KEY_FILE"
          echo "KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
          # trim whitespace from the IDs too
          echo "ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "TEAM_ID=$(printf '%s' "$TEAM_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          if openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "Key file parses as a valid private key."
          else
            echo "::error title=API key::ASC_KEY_P8 is not a valid private key. Re-paste the whole .p8 file contents."
            exit 1
          fi

      - name: Verify API key with Apple
        run: |
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]" 2>/dev/null || python3 -m pip install --quiet "pyjwt[crypto]"
          TOKEN=$(python3 - <<'PY'
          import jwt, os, time
          key = open(os.environ["KEY_PATH"]).read()
          now = int(time.time())
          print(jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"}))
          PY
          )
          CODE=$(curl -s -o "$RUNNER_TEMP/asc.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
                 "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.myguyinthechair.oasis")
          echo "Apple API responded: HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            DETAIL=$(python3 -c "import json;d=json.load(open('$RUNNER_TEMP/asc.json'));print('; '.join(e.get('detail','') for e in d.get('errors',[])))" 2>/dev/null)
            echo "::error title=API key rejected by Apple (HTTP $CODE)::$DETAIL -- Key ID length ${#ASC_KEY_ID} (should be 10), Issuer ID length ${#ASC_ISSUER_ID} (should be 36). Check the key ID matches the .p8 file and the issuer ID is correct."
            exit 1
          fi
          python3 -c "import json;d=json.load(open('$RUNNER_TEMP/asc.json'));print('Found app:', [a['attributes']['name'] for a in d['data']])"

      - name: Archive (unsigned; Apple signs it during export)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OasisSocial.xcodeproj \
            -scheme OasisSocial \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Oasis.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" || {
              grep -E "error:|error -|\*\* ARCHIVE FAILED|No profiles|No Accounts|requires a provisioning|Signing for" "$RUNNER_TEMP/archive.log" \
                | sed 's/%/%25/g' | sort -u | head -15 | while IFS= read -r line; do echo "::error title=Archive::$line"; done
              exit 1
            }

      - name: Export and upload to App Store Connect / TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Oasis.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" || {
              grep -E "error:|error -|EXPORT FAILED|Upload|App Store Connect" "$RUNNER_TEMP/export.log" \
                | sed 's/%/%25/g' | sort -u | head -15 | while IFS= read -r line; do echo "::error title=Export/Upload::$line"; done
              exit 1
            }

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/keys/AuthKey.p8"
